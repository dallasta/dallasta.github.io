# Academic Pages configuration for Luca Dall'Asta
# Based on the official Academic Pages template:
# https://github.com/academicpages/academicpages.github.io

locale                   : "en-US"
site_theme               : "air"
title                    : "Luca Dall'Asta"
title_separator          : "-"
name                     : &name "Luca Dall'Asta"
description              : &description "Associate Professor of Theoretical Physics at Politecnico di Torino"
url                      : "https://dallasta.github.io"
baseurl                  : ""
repository               : "dallasta/dallasta.github.io"

# Author profile
author:
  avatar           : "foto.png"
  name             : "Luca Dall'Asta"
  bio              : "Associate Professor of Theoretical Physics"
  location         : "Turin, Italy"
  employer         : "Politecnico di Torino"
  uri              : "https://www.polito.it/"
  email            : "luca.dallasta@polito.it"

  # Academic profiles
  googlescholar    : "https://scholar.google.com/citations?user=LucaDallAsta"
  orcid            : "https://orcid.org/0000-0002-3868-6188"

  # Professional profiles
  github           : "dallasta"

# Site settings
teaser                   :
breadcrumbs              : false
words_per_minute         : 160
future                   : true
read_more                : "disabled"
talkmap_link             : false

comments:
  provider               :

atom_feed:
  hide                   : false

# Social sharing / SEO
google_site_verification :
bing_site_verification   :
og_image                 :
og_description           :

social:
  type                   : "Person"
  name                   : "Luca Dall'Asta"
  links:
    - "https://orcid.org/0000-0002-3868-6188"
    - "https://github.com/dallasta"

analytics:
  provider               : false

# Reading Files
include:
  - .htaccess
  - _pages
  - files

# Markdown
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  toc_levels: 1..6

# Collections
collections:
  teaching:
    output: true
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

  - scope:
      path: ""
      type: teaching
    values:
      layout: single
      author_profile: true
      share: false
      comments: false

  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: false
      comments: false

  - scope:
      path: ""
      type: talks
    values:
      layout: talk
      author_profile: true
      share: false
      comments: false

# Plugins supported by GitHub Pages / Academic Pages
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

whitelist:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

permalink: /:categories/:title/

timezone: Europe/Rome
